# render.yaml  (Deployment)
# Tells Render (https://render.com) how to build and run the public demo.
# Read by "New -> Blueprint" in the Render dashboard; see docs/DEPLOYMENT.md for every click.
#
# NOTHING SECRET IS WRITTEN HERE. The only secret, DATATRUST_SECRET_KEY, is generated by
# Render itself (generateValue) and stored in Render, never in GitHub.
services:
  - type: web
    name: datatrust-ai              # becomes https://datatrust-ai.onrender.com (Render adds a suffix if taken)
    runtime: python
    plan: free
    autoDeploy: true                # every push to the branch below redeploys
    branch: main
    buildCommand: >-
      pip install -r requirements.txt &&
      python scripts/seed_demo.py
    # ONE worker process on purpose: background jobs, upload counters and the visitor checks
    # live in that process's memory. Threads serve several visitors at once.
    startCommand: >-
      gunicorn --chdir webapp datatrust_site.wsgi:application
      --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
      --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # --- production mode, open public demo ---
      - key: DATATRUST_DEBUG
        value: "0"
      - key: DATATRUST_PUBLIC_DEMO
        value: "1"
      - key: DATATRUST_SECRET_KEY
        generateValue: true         # Render creates a random 256-bit value; never typed, never in git
      # --- storage: SQLite inside the deployed files (the free plan has no persistent disk) ---
      - key: DATATRUST_DB
        value: sqlite
      - key: DATATRUST_SQLITE_PATH
        value: data/datatrust.db
      # --- upload limits for a small free server (512 MB memory, 0.1 CPU) ---
      - key: DATATRUST_MAX_FILE_MB
        value: "2"
      - key: DATATRUST_DEMO_MAX_ROWS
        value: "20000"
      - key: DATATRUST_DEMO_MAX_COLUMNS
        value: "50"
      - key: DATATRUST_DEMO_UPLOADS_PER_HOUR
        value: "10"
      - key: DATATRUST_DEMO_UPLOADS_PER_HOUR_TOTAL
        value: "60"
      - key: DATATRUST_DEMO_MAX_PENDING
        value: "3"
      - key: DATATRUST_DEMO_RETENTION_HOURS
        value: "24"
      - key: DATATRUST_DEMO_MAX_STORED_RUNS
        value: "300"
      # --- lighter model checks for visitor uploads (the samples use the laptop settings) ---
      - key: DATATRUST_ML_MAX_ROWS
        value: "3000"
      - key: DATATRUST_ML_CV_REPEATS
        value: "1"
      - key: DATATRUST_ML_IMPORTANCE_REPEATS
        value: "2"
      - key: OMP_NUM_THREADS          # scikit-learn: one thread per model on a 0.1-CPU server
        value: "1"
      # --- background analyses: one at a time ---
      - key: DATATRUST_WEB_BACKGROUND
        value: "1"
      - key: DATATRUST_WEB_WORKERS
        value: "1"
      - key: DATATRUST_SUMMARY_PROVIDER
        value: template
