{% extends "dashboard/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="empty">
  <p class="eyebrow">DataTrust AI</p>
  <h1>Log in</h1>
  <form method="post" action="{% url 'dashboard:login' %}" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="errors" role="alert"><p>{{ error }}</p></div>{% endif %}
    <div class="field">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" autofocus required>
    </div>
    <button class="button primary" type="submit">Log in</button>
  </form>
  <p class="help">The password is DATATRUST_WEB_PASSWORD in the project's .env file.</p>
</section>
{% endblock %}
